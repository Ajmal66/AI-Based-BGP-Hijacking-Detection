{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="upload-card shadow p-4">
        <h3>Upload BGP Dataset</h3>

        <form id="uploadForm">

            <input type="file" name="file" class="form-control mt-3" required>
            
            <select name="dataset_type" class="form-control mt-3">

                <option value="csv">
                    Custom CSV
                </option>

                <option value="ripe">
                    RIPE RIS Dump
                </option>

                <option value="routeviews">
                    RouteViews Dump
                </option>

            </select>

            <select name="model" class="form-control mt-3">
                <option value="rf">Random Forest</option>
                <option value="svm">SVM</option>
                <option value="lstm">LSTM</option>
            </select>

            <input
                type="number"
                name="limit"
                class="form-control mt-3"
                placeholder="Optional record limit (e.g. 10000)"
                min="1">

            <small class="text-muted">
                Note: The system processes up to the specified number of records. The final number analyzed may be lower after preprocessing removes duplicate, invalid, or incomplete records.
            </small>

            

            <div class="mt-3 d-flex gap-2">

                <a href="/sample-csv"
                class="btn btn-outline-primary">
                    Download Sample CSV
                </a>

                <a href="/guide"
                class="btn btn-outline-secondary">
                    User Guide
                </a>

            </div>

            <button class="btn btn-primary mt-3">
                Run Detection
            </button>

        </form>

        <div id="result" class="mt-4"></div>
    </div>

</div>

<!-- Toast Library -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
const form = document.getElementById("uploadForm");
const button = form.querySelector("button");

form.onsubmit = async function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    // LOADER START
    button.disabled = true;
    button.innerHTML = "Processing... ⏳";

    Swal.fire({
        title: "Processing...",
        html: "Running detection model",
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    try {
        let res = await fetch("/upload-file", {
            method: "POST",
            body: formData
        });

        let contentType = res.headers.get("content-type");

        let data;

        if (contentType && contentType.includes("application/json")) {
            data = await res.json();
        } else {
            let text = await res.text();
            throw new Error("Server returned invalid response: " + text.slice(0, 200));
        }

        if (!res.ok) {
            throw new Error(data.error || "Server error");
        }

        Swal.fire({
            title: "Detection Completed",
            html: `
                <b>Total:</b> ${data.total}<br>
                <b>Hijacks:</b> ${data.hijacks}<br>
                <b>Normal:</b> ${data.normal}
                <br><br>
                <a href="/${data.file}" class="btn btn-success mt-3" download>
                    Download Result CSV
                </a>
            `,
            icon: "success"
        });

    } catch (err) {
        Swal.fire("Error", err.message, "error");
    }

    // LOADER END
    button.disabled = false;
    button.innerHTML = "Run Detection";
};
</script>

{% endblock %}
